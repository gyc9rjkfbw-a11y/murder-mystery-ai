<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d14" />
    <title>谜案剧本杀</title>
    <style>
      html,
      body,
      #app {
        background: #06070b;
      }
    </style>

    <!-- PWA：装到手机桌面、全屏启动（见 public/manifest.webmanifest 与 public/sw.js） -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="application-name" content="谜案剧本杀" />
    <meta name="description" content="谜案剧本杀：单人试玩或开房和朋友一起玩，全屏运行，剧本由 AI 现生成。" />
    <!-- iOS：加到主屏幕后以「独立窗口」启动，不再有 Safari 的地址栏 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="谜案剧本杀" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
